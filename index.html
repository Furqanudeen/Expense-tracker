<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <h2 class="logo">Expense Tracker</h2>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Add Expense</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="expense-form">
  <h2>Add New Expense</h2>
  <form id="expenseForm">
    <input type="text" id="expenseName" placeholder="Expense Name" required>
    <input type="number" id="expenseAmount" placeholder="Amount (₹)" required>
    <input type="date" id="expenseDate" required>
    <button type="submit">Add Expense</button>
  </form>
</section>
<section class="expense-table">
  <h2>Expense List</h2>
  <table id="expenseList">
    <thead>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      <!-- Expenses will appear here -->
    </tbody>
  </table>
</section>
    <section class="hero">
      <h1>Track Your Expenses Easily</h1>
      <p>Manage your budget with a clean, professional interface.</p>
      <button>Get Started</button>
    </section>
  </main>
  <footer>
    <p>© 2026 Furqanudeen | Built with ❤️</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
